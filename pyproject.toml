[project]
name = "xps-fitting-workbench"
dynamic = ["version"]
description = "Reproducible, chemistry-constrained XPS peak fitting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lmfit>=1.2",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "openpyxl>=3.0",
  "pandas>=2.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.8",
  "pre-commit>=3.7",
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
xps-fit = "xps_fitting.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "xps_fitting._version.__version__"}

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
  "ignore:The py23 module has been deprecated.*:DeprecationWarning:fontTools\\.misc\\.py23",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["xps_vgd_extraction_and_plotting.ipynb", "xps_vgd_utils.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = [
  "src/xps_fitting/_version.py",
  "src/xps_fitting/spectrum.py",
  "src/xps_fitting/result.py",
  "src/xps_fitting/configuration.py",
  "src/xps_fitting/naming.py",
  "src/xps_fitting/export.py",
]
disallow_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_configs = true
